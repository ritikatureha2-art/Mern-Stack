<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form style</title>
    <style>
        table
        {
            background-color: pink;
        }
          body
          {
            background: aqua;
          }

    </style>
</head>
<body>

    <h1 align="center">----REGISTRATION FORM----</h1>
      <form action="">
        <table border="3" width="50%" align="center" cellpadding="20"   >
            <tr> 
                <th>
                    <label for="fname">First Name </label>
                </th>
                <td>
                    <input type="text"  id ="fname" placeholder="enter your first name ">
                </td>
            </tr>

             <tr> 
                <th>
                    <label for="">Last Name </label>
                </th>
                <td>
                    <input type="text" placeholder="enter your last name ">
                </td>
            </tr>

            <tr> 
                <th>
                    <label for="">E-mail </label>
                </th>
                <td>

                    <input type="email" placeholder="abc@gmail.com ">
                </td>
            </tr>
        

            <tr> 
                <th>
                    <label for="">Password </label>
                </th>
                <td>

                    <input type="password">
                </td>
            </tr>


             <tr> 
                <th>
                    <label for="">Gender </label>
                </th>
                <td>
                    <label for="">Male </label>
                    <input type="radio" value="Male" name="g1">

                    <label for="">Female </label>
                    <input type="radio" value="Female" name="g1">

                </td>
            </tr>


            <tr> 
                <th>
                    <label for="">Highest Qualification </label>
                </th>
                <td>
                    <label for="">10</label>
                    <input type="radio" value="10" name="g2">

                    <label for="">12 </label>
                    <input type="radio" value="12" name="g2">

                    <label for="">BCA</label>
                    <input type="radio" value="BCA" name="g2">


                </td>
            </tr>
           
           
            <tr> 
                <th>
                    <label for="">Skills </label>
                </th>
                <td>
                    <label for="">html </label>
                    <input type="checkbox"  name="1">

                    <label for="">css </label>
                    <input type="checkbox"  name="1">
                    
                    <label for="">js </label>
                    <input type="checkbox"  name="1">

                </td>
            </tr>


            <tr>
                <th>Select City</th>
                <td>
                    <select name="" id="">]
                       
                        <option value="city"> ----select city----</option>
                        <option value="city"> delhi</option>
                        <option value="city"> noida</option>
                        <option value="city"> meerut</option>
                        <option value="city"> nainital</option>
                    </select>
                </td>
            </tr>


            <tr> 
                <th>
                    <label for="">DOB </label>
                </th>
                <td>

                    <input type="date">
                </td>
            </tr>


             <tr> 
                <th>
                    <label for="">Select Range </label>
                </th>
                <td>

                    <input type="range">
                </td>
            </tr>
             

            <tr>
                <td>
                    <input type="submit" align="center">
                </td>
                <td>
                    <input type="reset" align="center">
                </td>
            </tr>



        </table>
      </form>
</body>
</html>
